name: AI-SDLC Command Bridge

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: >-
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      startsWith(github.event.comment.body, '/ai-sdlc ')
    runs-on: ubuntu-latest
    steps:
      - name: Parse trusted AI-SDLC command
        id: command
        shell: python
        env:
          COMMAND: ${{ github.event.comment.body }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          import os
          import re

          command = os.environ['COMMAND'].strip()
          default_branch = os.environ['DEFAULT_BRANCH']

          bootstrap = re.fullmatch(
              r'/ai-sdlc bootstrap target_ref=([A-Za-z0-9._/-]+) bootstrap=(state/bootstrap/[A-Za-z0-9._/-]+\.ya?ml) manifest=(state/features/[A-Za-z0-9._/-]+\.ya?ml)',
              command,
          )
          plan = re.fullmatch(
              r'/ai-sdlc plan target_ref=([A-Za-z0-9._/-]+) manifest=(state/features/[A-Za-z0-9._/-]+\.ya?ml)',
              command,
          )
          persist = re.fullmatch(
              r'/ai-sdlc persist target_ref=([A-Za-z0-9._/-]+) manifest=(state/features/[A-Za-z0-9._/-]+\.ya?ml) event=(state/events/[A-Za-z0-9._/-]+/[A-Za-z0-9._:-]+\.ya?ml)',
              command,
          )

          event_path = ''
          if bootstrap:
              operation = 'bootstrap'
              workflow = 'ai-sdlc-bootstrap.yml'
              target_ref, bootstrap_path, manifest_path = bootstrap.groups()
              if target_ref == default_branch:
                  raise SystemExit('AI-SDLC bootstrap command cannot persist to the default branch')
          elif plan:
              operation = 'plan'
              workflow = 'ai-sdlc-plan.yml'
              target_ref, manifest_path = plan.groups()
              bootstrap_path = ''
          elif persist:
              operation = 'persist'
              workflow = 'ai-sdlc-persist.yml'
              target_ref, manifest_path, event_path = persist.groups()
              bootstrap_path = ''
              if target_ref == default_branch:
                  raise SystemExit('AI-SDLC persist command cannot write to the default branch')
          else:
              raise SystemExit('invalid AI-SDLC command')

          for value in (target_ref, bootstrap_path, manifest_path, event_path):
              if value and '..' in value.split('/'):
                  raise SystemExit('parent traversal is not allowed')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'operation={operation}\n')
              handle.write(f'workflow={workflow}\n')
              handle.write(f'target_ref={target_ref}\n')
              handle.write(f'bootstrap_path={bootstrap_path}\n')
              handle.write(f'manifest_path={manifest_path}\n')
              handle.write(f'event_path={event_path}\n')

      - name: Dispatch installed AI-SDLC caller workflow
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ steps.command.outputs.operation }}
          WORKFLOW: ${{ steps.command.outputs.workflow }}
          TARGET_REF: ${{ steps.command.outputs.target_ref }}
          BOOTSTRAP_PATH: ${{ steps.command.outputs.bootstrap_path }}
          MANIFEST_PATH: ${{ steps.command.outputs.manifest_path }}
          EVENT_PATH: ${{ steps.command.outputs.event_path }}
          FEATURE_ISSUE: ${{ github.event.issue.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          dispatched_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"
          if [[ "$OPERATION" == "bootstrap" ]]; then
            gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" --field target_ref="$TARGET_REF" --field bootstrap_path="$BOOTSTRAP_PATH" --field manifest_path="$MANIFEST_PATH" --field persist=true --field allow_default_branch=false
          elif [[ "$OPERATION" == "persist" ]]; then
            gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" --field target_ref="$TARGET_REF" --field manifest_path="$MANIFEST_PATH" --field event_path="$EVENT_PATH" --field feature_issue="$FEATURE_ISSUE" --field dry_run=false --field allow_default_branch=false
          else
            gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" --field target_ref="$TARGET_REF" --field manifest_path="$MANIFEST_PATH" --field policy_path=
          fi

      - name: Post command receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OPERATION: ${{ steps.command.outputs.operation }}
          TARGET_REF: ${{ steps.command.outputs.target_ref }}
          MANIFEST_PATH: ${{ steps.command.outputs.manifest_path }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "AI-SDLC command accepted: \`$OPERATION\`. Target: \`$TARGET_REF\`. Manifest: \`$MANIFEST_PATH\`. Command run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
