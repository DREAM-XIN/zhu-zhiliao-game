name: Implementation CI

on:
  push:
    branches:
      - feature/F-ZHIZHILIAO-MVP-0001
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect tracked lockfile
        id: lock
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "existing=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        run: |
          if [ "${{ steps.lock.outputs.existing }}" = "true" ]; then
            npm ci
          else
            npm install
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Persist generated lockfile
        if: ${{ github.event_name == 'push' && steps.lock.outputs.existing == 'false' }}
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "build: add npm lockfile"
          git push origin HEAD:${GITHUB_REF_NAME}
